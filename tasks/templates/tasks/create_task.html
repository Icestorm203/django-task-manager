<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание задачи</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="mb-4">Новая задача</h1>

    <div class="card">
        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Название</label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Сохранить
                </button>

                <a href="{% url 'task_list' %}" class="btn btn-secondary">
                    Назад
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
