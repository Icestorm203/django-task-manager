<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .task {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .title {
            margin: 0;
            color: #222;
        }

        .description {
            margin-top: 10px;
            color: #555;
        }

        .meta {
            margin-top: 10px;
            font-size: 14px;
            color: gray;
        }

        .open {
            color: green;
            font-weight: bold;
        }

        .closed {
            color: red;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>📋 Менеджер задач</h1>

    {% for task in tasks %}
        <div class="task">
            <h2 class="title">{{ task.title }}</h2>

            <div class="description">
                {{ task.description }}
            </div>

            <div class="meta">
                Создано: {{ task.created_at }}
            </div>

            <div class="meta">
                Статус:
                {% if task.is_closed %}
                    <span class="closed">Закрыта</span>
                {% else %}
                    <span class="open">Открыта</span>
                {% endif %}
            </div>
        </div>
    {% empty %}
        <div class="empty">
            <h3>Задач пока нет</h3>
            <p>Добавьте задачи через админ-панель.</p>
        </div>
    {% endfor %}

</body>
</html>
