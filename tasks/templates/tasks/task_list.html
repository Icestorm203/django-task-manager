<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>📋 Менеджер задач</h1>

        <div>
            <a href="/admin/" class="btn btn-outline-secondary">Admin</a>
            <a href="{% url 'create_task' %}" class="btn btn-primary">
                Новая задача
            </a>
        </div>

    </div>

    <div class="d-flex gap-2 mb-4">

        <a href="/" class="btn btn-outline-dark">
            Все
        </a>

        <a href="/?status=open" class="btn btn-outline-success">
            Открытые
        </a>

        <a href="/?status=closed" class="btn btn-outline-danger">
            Закрытые
        </a>

    </div>
    {% for task in tasks %}

    <div class="card shadow-sm mb-3">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-start">
                <h3 class="card-title">
                    {{ task.title }}
                </h3>

                <div class="d-flex align-items-center gap-2">

                
                    {% if task.is_closed %}
                        <span class="badge bg-danger">
                            Закрыта
                        </span>
                        <a 
                            href="{% url 'toggle_task' task.id %}"
                            class="btn btn-sm btn-outline-success ms-2"
                        >
                            Открыть
                        </a>
                    {% else %}
                        <span class="badge bg-success">
                            Открыта
                        </span>

                        <a 
                            href="{% url 'close_task' task.id %}"
                            class="btn btn-sm btn-outline-danger ms-2"
                        >
                            Закрыть
                        </a>
                    {% endif %}
                </div>
            </div>

            <p class="card-text mt-3">
                {{ task.description }}
            </p>

            <small class="text-muted">
                Создано: {{ task.created_at|date:"d.m.Y H:i"}}
            </small>

        </div>
    </div>

    {% empty %}

    <div class="alert alert-info">
        Задач пока нет
    </div>

    {% endfor %}

</div>

</body>
</html>
